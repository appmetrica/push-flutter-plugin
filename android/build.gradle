group "io.appmetrica.analytics.push.flutter"
version "3.2.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:8.2.0"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

android {
    if (project.android.hasProperty("namespace")) {
        namespace = "io.appmetrica.analytics.push.flutter"
    }
    buildToolsVersion "36.0.0"
    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 36

        proguardFiles("proguard/proguard-rules.pro")
        consumerProguardFiles("proguard/consumer-rules.pro")
    }
}

dependencies {
    implementation("io.appmetrica.analytics:push:4.3.0")

    implementation("io.appmetrica.analytics:push-provider-api:4.3.0")
    implementation("io.appmetrica.analytics:push-provider-firebase:4.3.0")
}
